policy: payments-chargeback
version: 1
description: |
  Fintech ops: chargeback reversal and dispute management. Low-value
  reversals for accounts not under investigation allow automatically.
  High-value or repeat disputes require fraud-ops-manager approval.
  Accounts under investigation are denied outright.

  Demo quick reference:
    DENY              — context.account_under_investigation=true  (condition unmet)
    ALLOW             — account_under_investigation=false, amount_usd=50,  recent_chargebacks=0
    REQUIRE_APPROVAL  — account_under_investigation=false, amount_usd=3000, recent_chargebacks=2
    DENY              — account_under_investigation=false, amount_usd=10000

applies_to:
  actions:
    - payments.reverse.chargeback
    - payments.contest.dispute

conditions:
  # Accounts currently under investigation must not be touched autonomously.
  - field: context.account_under_investigation
    op: eq
    value: false

risk_factors:
  # Reversal amount (soft=$500, hard=$10,000)
  - source: blast_radius
    weight: 0.75
    inputs:
      field: context.amount_usd
      soft_limit: 500
      hard_limit: 10000

  # Repeat-dispute signal: agents with frequent recent chargebacks are higher risk
  - source: actor_history
    weight: 0.25
    inputs:
      field: context.actor_history.recent_chargebacks
      baseline: 5

thresholds:
  allow_below: 0.15
  approval_below: 0.70
  deny_above: 0.70

approval:
  required_roles: [fraud-ops-manager]
  timeout_ms: 3600000   # 1 hour
